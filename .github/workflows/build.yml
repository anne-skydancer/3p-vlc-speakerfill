name: Build vlc-speakerfill package
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  AUTOBUILD_BUILD_ID: ${{ github.run_id }}
jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install autobuild==3.9.3
      # The GCC-based MinGW-w64 preinstalled on the windows-2025 image (MSVCRT runtime, as VLC 3's own
      # Windows build). llvm-mingw's lld crashed on this runner; the version used is recorded in build-info.txt.
      - name: Use the runner's MinGW gcc
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction Stop
          $bin = Split-Path $gcc.Source
          Write-Host "runner gcc: $($gcc.Source)"
          & $gcc.Source -dumpmachine
          # build.cmake looks for the triplet-prefixed name only; expose the runner's gcc under it.
          $shim = Join-Path $env:RUNNER_TEMP 'mingw-shim'
          New-Item -ItemType Directory -Force $shim | Out-Null
          Copy-Item $gcc.Source (Join-Path $shim 'x86_64-w64-mingw32-gcc.exe')
          Copy-Item (Join-Path $bin 'objdump.exe') (Join-Path $shim 'x86_64-w64-mingw32-objdump.exe')
          $shim | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Record compiler
        shell: pwsh
        run: |
          $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction Stop
          Write-Host $gcc.Source
          & $gcc.Source --version
          & $gcc.Source -dumpmachine
      - name: Install dependencies (vlc-bin)
        run: autobuild install -A 64
      - name: Build and smoke test
        run: autobuild build -A 64 -c release
      - name: Package
        run: autobuild package -A 64 -c release --archive-format tzst
      - name: Verify package contents
        shell: pwsh
        run: |
          $archive = Get-ChildItem *.tar.zst | Select-Object -First 1
          if (-not $archive) { throw 'no package produced' }
          $list = tar -tf $archive.Name
          foreach ($want in 'lib/release/libspeakerfill_output_plugin.dll', 'LICENSES/vlc-speakerfill.txt', 'autobuild-package.xml', 'VERSION.txt') {
            if (-not ($list -contains $want)) { throw "package is missing $want" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive.Name).Hash.ToLowerInvariant()
          "$($archive.Name)  sha256=$hash" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: vlc-speakerfill-windows64
          path: '*.tar.zst'
          if-no-files-found: error

  # Publishes the package when a tag v<VERSION.txt> is pushed. Tags are created by the owner.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION.txt
        run: |
          expected="v$(tr -d '\r\n' < VERSION.txt)"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then echo "tag ${GITHUB_REF_NAME} != $expected"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: vlc-speakerfill-windows64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          archive=$(ls *.tar.zst)
          sha256sum "$archive" | tee SHA256SUMS.txt
          sha1sum "$archive" | tee SHA1SUMS.txt
          tar --zstd -xOf "$archive" share/vlc-speakerfill/build-info.txt > build-info.txt
          tar --zstd -xOf "$archive" autobuild-package.xml > autobuild-package.xml
          {
            echo "VLC 3.0.21 speaker-fill WASAPI output module (modules/audio_output/wasapi.c with Vulkanstorm's patch), prebuilt so the Windows viewer build needs no MinGW. Temporary: retired when the Rust audio engine reaches vkstorm-release."
            echo
            echo "## Package"
            echo "- name: vlc-speakerfill, version: ${GITHUB_REF_NAME#v}, platform: windows64"
            echo "- licence: LGPL-2.1+ (LICENSES/vlc-speakerfill.txt, VLC's COPYING.LIB)"
            echo "- copyright: Copyright (C) 2012 Remi Denis-Courmont and VLC authors"
            echo "- source commit: ${GITHUB_SHA}"
            echo "- build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Upstream sources (VLC 3.0.21, SHA-256 pinned in prepare_speakerfill.cmake)"
            sed -n 's/^speakerfill_source(\([^ ]*\) \([^ ]*\) \([0-9a-f]*\))/- \2 (`\3`)/p' ../prepare_speakerfill.cmake
            echo "- COPYING.LIB (\`dc626520dcd53a22f727af3ee42c770e56c97a64fe3adb063799d8ab032fe551\`)"
            echo
            echo "## Compiler"
            echo '```'
            cat build-info.txt
            echo '```'
            echo
            echo "## autobuild-package.xml"
            echo '```xml'
            cat autobuild-package.xml
            echo '```'
            echo
            echo "## Checksums"
            echo '```'
            echo "sha256  $(cut -d' ' -f1 SHA256SUMS.txt)"
            echo "sha1    $(cut -d' ' -f1 SHA1SUMS.txt)"
            echo '```'
            echo "autobuild.xml: hash_algorithm sha256 with the sha256 above, url the asset below."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" "$archive" SHA256SUMS.txt SHA1SUMS.txt build-info.txt autobuild-package.xml             --repo "${GITHUB_REPOSITORY}"             --title "vlc-speakerfill ${GITHUB_REF_NAME#v} - Windows x64"             --notes-file notes.md
